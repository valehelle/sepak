<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1017" />
    <title>Geng Turun Peluh</title>
    <meta name="description" content="Booking sesi bola Geng Turun Peluh." />

    <!-- Share preview. Absolute URLs: WhatsApp, Telegram and the rest fetch
         these without a page context, so a relative path resolves to
         nothing. The site is a single-page app served as one static
         index.html, so every link shares this one preview -- crawlers do
         not run the JavaScript that would make it per-session. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Geng Turun Peluh" />
    <meta property="og:locale" content="ms_MY" />
    <meta property="og:title" content="Geng Turun Peluh 30+" />
    <meta property="og:description" content="Booking sesi bola Geng Turun Peluh." />
    <meta property="og:url" content="https://valehelle.github.io/sepak/" />
    <meta property="og:image" content="https://valehelle.github.io/sepak/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Padang bola di bawah lampu limpah pada waktu malam" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Geng Turun Peluh 30+" />
    <meta name="twitter:description" content="Booking sesi bola Geng Turun Peluh." />
    <meta name="twitter:image" content="https://valehelle.github.io/sepak/og.jpg" />

    <!-- Installable, which on iOS is the only way push notifications are
         allowed to reach a web app at all. Paths are absolute and carry the
         base: a session page is served from /sepak/s/<id>/, where a relative
         href would resolve one directory too deep and 404. Same reason the
         og: URLs above are absolute. -->
    <link rel="manifest" href="/sepak/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/sepak/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/sepak/icon-192.png" />
    <!-- What iOS writes under the home-screen icon; the manifest's name is
         too long to survive there. -->
    <meta name="apple-mobile-web-app-title" content="GTP" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
